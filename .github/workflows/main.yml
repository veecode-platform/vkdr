name: GraalVM Native Image builds
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
jobs:
  build:
    name: VKDR on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os-name: linux
            arch: amd64
          - os: ubuntu-24.04-arm
            os-name: linux
            arch: arm64
          - os: macos-15-intel
            os-name: osx
            arch: amd64
          # macos-latest = macos 15 arm (M1+)
          - os: macos-latest
            os-name: osx
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      # Native Image copies the build JDK's cacerts into the binary at build time, so a newer
      # JDK does not fix an existing binary. Remove the two aliases the GraalVM Native Image
      # advisory names for CVE-2026-114820 (2026-10-23) before native:compile. Delete this step
      # once the build JDK no longer contains them.
      - name: Remove eMudhra and AAA roots from the build JDK
        run: |
          keytool="$JAVA_HOME/bin/keytool"
          listing=$("$keytool" -list -cacerts -storepass changeit)
          for alias in 'emsigneccrootcag3 [jdk]' 'comodoaaaca [jdk]'; do
            if grep -qF "$alias," <<<"$listing"; then
              "$keytool" -delete -cacerts -storepass changeit -alias "$alias"
            fi
          done
          listing=$("$keytool" -list -cacerts -storepass changeit)
          if grep -E -q 'emsigneccrootcag3|comodoaaaca' <<<"$listing"; then
            echo "::error::eMudhra or AAA root still present in the build JDK cacerts"
            exit 1
          fi

      - name: Build native binary and run VKDR CLI
        run: |
          ./mvnw -Pnative native:compile
          mv ./target/vkdr ./target/vkdr-${{ matrix.os-name }}-${{ matrix.arch }}
      
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: vkdr-${{ matrix.os-name }}-${{ matrix.arch }}
          path: ./target/vkdr-${{ matrix.os-name }}-${{ matrix.arch }}

  release:
    name: VKDR Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
      - name: Release version and assets
        uses: softprops/action-gh-release@v3
        with:
          files: '**/vkdr-*'
          token: ${{ secrets.GITHUB_TOKEN }}
