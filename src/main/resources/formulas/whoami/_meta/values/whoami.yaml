ingress:
  enabled: true
  annotations:
    # Kong builds Ingress routes as HTTPS-only, answering plain HTTP with 426.
    # Harmless no-op under traefik/nginx.
    konghq.com/protocols: "http,https"
  hosts:
    - host: whoami.localhost
      paths:
        - /
  tls:
    - secretName: whoami-tls
      hosts:
        - whoami.localhost
service:
  ports:
    http: 80

commonLabels: {}
